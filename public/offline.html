<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c7f6e" />
    <title>Offline - Alfilaha</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Albert Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #0c7f6e;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.6; color: #475569; margin: 0 0 20px; }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 9999px;
        background: #0c7f6e;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">A</div>
      <h1>Kamu sedang offline</h1>
      <p>
        Sepertinya tidak ada koneksi internet. Halaman ini belum tersimpan untuk
        diakses offline. Periksa koneksi lalu coba lagi.
      </p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
